[project]
name = "knot-calendar"
version = "0.1.0"
description = "A self-hosted calendar where every occurrence of a recurring event keeps its own checklist and record"
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [
    { name = "MonkeEngineer", email = "56447949+MonkeEngineer@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "django~=6.1.3",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.6",
]

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
